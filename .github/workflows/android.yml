name: Android release and Pages

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - VERSION_CODE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tapdance-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic
      - name: Lint, test, and assemble
        run: ./gradlew --no-daemon --stacktrace lintRelease testReleaseUnitTest assembleRelease
      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports-${{ github.run_id }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  package:
    needs: verify
    if: >-
      github.repository == 'pierce403/tapdance' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      attestation-url: ${{ steps.attest.outputs.attestation-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic
      - name: Read release metadata
        id: meta
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            changed="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
            grep -Fxq VERSION <<<"$changed"
            grep -Fxq VERSION_CODE <<<"$changed"
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          version_code="$(tr -d '[:space:]' < VERSION_CODE)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version-code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Build exact publishable APK
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version-code }}
        run: >-
          ./gradlew --no-daemon --stacktrace assembleRelease
          -PtapdanceVersionName="$VERSION_NAME"
          -PtapdanceVersionCode="$VERSION_CODE"
      - name: Stage, verify, and checksum APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m 0644 app/build/outputs/apk/release/app-release.apk dist/tapdance.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs dist/tapdance.apk | tee dist/apksigner.txt
          (cd dist && sha256sum tapdance.apk > tapdance.apk.sha256)
          (cd dist && sha256sum -c tapdance.apk.sha256)
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/apksigner.txt | head -1)"
          test -n "$signer"
          printf '%s\n' "$signer" > dist/tapdance.apk.cert-sha256
          cp RELEASE_NOTES.md dist/release-notes.md
          echo "sha256=$(cut -d ' ' -f1 dist/tapdance.apk.sha256)" >> "$GITHUB_OUTPUT"
          echo "signer=$signer" >> "$GITHUB_OUTPUT"
      - name: Attest APK provenance
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: dist/tapdance.apk
      - name: Build static download site
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          SIGNER_SHA256: ${{ steps.apk.outputs.signer }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R site/. _site/
          install -m 0644 dist/tapdance.apk _site/tapdance.apk
          install -m 0644 dist/tapdance.apk.sha256 _site/tapdance.apk.sha256
          touch _site/.nojekyll
          build_date="$(date -u +%Y-%m-%d)"
          sed -i \
            -e "s|__VERSION__|$VERSION|g" \
            -e "s|__BUILD_DATE__|$build_date|g" \
            -e "s|__APK_SHA256__|$APK_SHA256|g" \
            -e "s|__SIGNER_SHA256__|$SIGNER_SHA256|g" \
            _site/index.html
          if grep -Eq '__[A-Z0-9_]+__' _site/index.html; then
            echo "Unresolved release token in site/index.html" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: tapdance-${{ steps.meta.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
          retention-days: 1

  release:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.package.outputs.tag }}
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tapdance-${{ needs.package.outputs.version }}
          path: dist
      - name: Verify downloaded artifact
        run: (cd dist && sha256sum -c tapdance.apk.sha256)
      - name: Publish idempotent prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir prior
            gh release download "$TAG" --pattern tapdance.apk.sha256 --dir prior
            cmp dist/tapdance.apk.sha256 prior/tapdance.apk.sha256 || {
              echo "Version $VERSION already exists with different bytes; bump VERSION." >&2
              exit 1
            }
          else
            gh release create "$TAG" \
              dist/tapdance.apk \
              dist/tapdance.apk.sha256 \
              dist/tapdance.apk.cert-sha256 \
              --target "$GITHUB_SHA" \
              --title "TapDance $VERSION" \
              --notes-file dist/release-notes.md \
              --prerelease
          fi

  pages:
    needs: [package, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
